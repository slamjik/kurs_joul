x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-kafis_db}
      POSTGRES_USER: ${DB_USER:-kafis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kafis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kafis_user} -d ${DB_NAME:-kafis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - AUDIT_LOG_RETENTION_DAYS=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"
    networks:
      - internal_net
      - web_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    networks:
      - web_net

  nginx:
    image: nginx:alpine
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - web_net

networks:
  internal_net:
    internal: true # Полная изоляция от внешнего интернета (БД и Redis защищены от C2 exfiltration)
  web_net:

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
