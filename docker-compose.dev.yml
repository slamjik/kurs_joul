version: '3.8'

services:
  # ─── PostgreSQL 15 (Основная реляционная база данных) ─────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: kafis_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: kafis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kafis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 (Кэширование KPI и агрегаций) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kafis_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
